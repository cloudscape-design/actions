name: Patch package.json with local dependencies
description: Modifies the current package.json to point to local repositories instead
inputs:
  path:
    description: Root directory of the package that should be updated
    required: true
  tarball-dir:
    description: Path to the directory containing the local tarballs
    required: true
    default: './.build-cache'
  build-tools-ref:
    description: >-
      Git ref (branch or SHA) to install @cloudscape-design/build-tools from during a dry-run.
      Set only when the dry-run source repository is build-tools; leave empty otherwise.
    required: false
    default: ''
  build-tools-repository:
    description: >-
      Repository to install @cloudscape-design/build-tools from during a dry-run. Set it to the
      pull request's head repository so that dry-runs of forked pull requests resolve, as their
      branches only exist in the fork. Defaults to the upstream repository when empty.
    required: false
    default: 'cloudscape-design/build-tools'
runs:
  using: 'node20'
  main: 'index.js'
