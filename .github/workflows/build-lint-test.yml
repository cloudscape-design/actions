name: Build, lint and test

on:
  workflow_call:
    inputs:
      skip-tests:
        required: false
        type: boolean
        default: false
      skip-codeql:
        type: boolean
        description: Skip CodeQL checks
        required: false
        default: false
      skip-codecov:
        type: boolean
        description: Skip code coverage step
        required: false
        default: false
      artifact-path:
        type: string
        description: An optional file, directory or wildcard pattern that describes what to upload
      artifact-name:
        type: string
        description: An optional artifact name
        default: artifact
      coverage-artifact-name:
        type: string
        description: Artifact name for the fork coverage report; template the matrix into it to keep it unique per leg
        required: false
        default: coverage-report
      react-version:
        type: string
        description: React major version target (e.g. "16" or "18")
        required: false
        default: "16"

permissions:
  actions: read
  contents: read
  security-events: write

env:
  # Disable Husky in CI
  # https://typicode.github.io/husky/how-to.html#ci-server-and-docker
  HUSKY: 0

jobs:
  git-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 500

      - name: Install git-secrets
        run: |
          wget -O /usr/local/bin/git-secrets https://raw.githubusercontent.com/awslabs/git-secrets/master/git-secrets
          chmod +x /usr/local/bin/git-secrets
          git secrets --register-aws --global

      - name: Run git-secrets
        run: git secrets --scan-history

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Repository
        uses: cloudscape-design/actions/.github/actions/build-repository@main
        with:
          repository: ${{ github.repository }}
          skip-tests: ${{ inputs.skip-tests }}
          artifact-path: ${{ inputs.artifact-path }}
          artifact-name: ${{ inputs.artifact-name }}
          react-version: ${{ inputs.react-version }}
      - name: Codecov
        if: ${{ inputs.skip-codecov == false && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
      # Codecov resolves report paths against the repository file list; the privileged upload job has no checkout.
      - name: Record the file network for fork upload
        if: ${{ inputs.skip-codecov == false && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -d coverage ]; then
            git ls-files -z > coverage/network
          fi
      # Fork pull requests run without secrets, so they cannot upload to Codecov from here.
      # Only the coverage data is uploaded as an artifact; the separate "Codecov fork upload"
      # workflow (codecov-fork-upload.yml) submits it with the token and derives the commit
      # identity from the trusted workflow_run event, never from this artifact.
      # Artifact names must be unique within a run, so a caller that fans this workflow out over a
      # matrix has to template the matrix into coverage-artifact-name, exactly as it already does
      # for artifact-name. Codecov merges multiple uploads for the same commit, so each leg's
      # coverage is additive.
      - name: Upload coverage artifact for fork upload
        if: ${{ inputs.skip-codecov == false && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.coverage-artifact-name }}
          path: coverage/
          # Never fail the fork build when a repository produces no coverage output.
          if-no-files-found: warn
          retention-days: 1

  codeql:
    if: ${{ inputs.skip-codeql == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
