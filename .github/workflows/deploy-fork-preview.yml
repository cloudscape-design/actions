name: Deploy fork preview

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Artifact to download/deploy; also the target path and the `fork-` environment suffix
        type: string
        required: true

permissions:
  id-token: write
  contents: read
  deployments: write
  actions: read

jobs:
  deploy:
    if: >
      ${{ github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name != github.event.workflow_run.repository.full_name }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Deploy dev-pages
        id: deploy
        uses: cloudscape-design/actions/.github/actions/deploy-static@main
        with:
          role-to-assume: ${{ secrets.AWS_PREVIEW_ROLE_ARN }}
          deployment-bucket: ${{ secrets.AWS_PREVIEW_BUCKET_NAME }}
          source-path: build
          target-path: ${{ inputs.artifact-name }}
          commit-sha: ${{ github.event.workflow_run.head_sha }}
      # workflow_run uses the default branch ref, so explicitly attach the deployment to the fork PR commit
      - name: Attach deployment to pull request
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ENVIRONMENT: fork-${{ inputs.artifact-name }}
          ENVIRONMENT_URL: ${{ steps.deploy.outputs.preview-url }}index.html
        with:
          script: |
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.workflow_run.head_sha,
              environment: process.env.DEPLOYMENT_ENVIRONMENT,
              auto_merge: false,
              required_contexts: [],
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: 'success',
              environment_url: process.env.ENVIRONMENT_URL,
            });
